name: Cross-Platform Build & Release

on:
  push:
    branches:
      - 'feature/tauri-rust-rebuild'
      - 'main'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # tauri-action merges each platform's signature into latest.json by
      # reading then replacing the release asset. Serialize matrix jobs so
      # concurrent uploads cannot overwrite another platform's entry.
      max-parallel: 1
      matrix:
        include:
          - platform: 'windows-latest'
            name: 'windows'
            args: '--bundles nsis'
          - platform: 'ubuntu-22.04'
            name: 'linux'
            args: ''
          - platform: 'macos-latest'
            name: 'macos'
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || 'lyricflow' }}
        with:
          projectPath: "./src-tauri"
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "LyricFlow ${{ github.ref_name }}"
          releaseBody: |
            ## What's New in LyricFlow ${{ github.ref_name }}

            ### ⚡ Sub-Second Fast Lyrics Fetching
            - Eliminated sequential waterfall delays; fast providers like LRCLIB (150ms) and NetEase display immediately without waiting on slow/unindexed scrapers.
            - Reduced scraper timeout budget to 2.2s and stopped redundant retry cascades on unindexed tracks.

            ### 🔒 Persistent OTA Login Retention
            - Dual-tier storage redundancy ensures Spotify (`sp_dc`) and Last.fm logins are retained across OTA updates, WebView2 refreshes, and app upgrades.
            - Returning authenticated users bypass the onboarding wizard and stay logged in.

            ### 🎨 Studio Split View (Redesigned Main UI)
            - Dual-pane layout with adaptive album artwork, ambient background glow, song details, and audio visualizer on the left.
            - Silky-smooth, word-by-word synchronized lyrics scrolling on the right with responsive tall artwork scaling.

            ### 📌 Windows Taskbar Mode
            - Minimalist frosted glass lyric ribbon docked directly onto the Windows taskbar.
            - Real-time word and syllable highlights with playhead scrubber and media controls.

            ### 🎬 Cinematic & Kinetic Modes
            - Dynamic typography choreography and audio-reactive generative visualizers turning tracks into an immersive music video.

            ### ⚡ Redeveloped Word-by-Word Engine & qApple
            - Ground-up rebuild of the word-by-word karaoke engine with sub-millisecond cadence interpolation and drift correction.
            - Reliable qApple word-level lyrics from Apple Music with automated multi-mirror failover and cache resilience.

            ### 🪄 Animated Artworks (Apple Motion Art)
            - Hardware-accelerated decoding and smooth ambient playback for official animated album artworks on supported releases.

            ### 🚀 Deep Performance Optimizations
            - 3-Phase CPU reduction, GPU compositor layer containment, background defrost throttling, and sub-16ms layout frame rates.

            ### 💡 Genius Annotations & Fact Cards
            - Contextual in-line annotations and crowdsourced lyrical interpretations right beside active lyric lines.

            See [README](https://github.com/badghost001/LyricFlow#readme) for full application documentation and setup.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lyricflow-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/universal-apple-darwin/release/bundle/
          if-no-files-found: warn
