name: Cross-Platform Build & Release

on:
  push:
    branches:
      - 'feature/tauri-rust-rebuild'
      - 'main'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # tauri-action merges each platform's signature into latest.json by
      # reading then replacing the release asset. Serialize matrix jobs so
      # concurrent uploads cannot overwrite another platform's entry.
      max-parallel: 1
      matrix:
        include:
          - platform: 'windows-latest'
            name: 'windows'
            args: '--bundles nsis'
          - platform: 'ubuntu-22.04'
            name: 'linux'
            args: ''
          - platform: 'macos-latest'
            name: 'macos'
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || 'lyricflow' }}
        with:
          projectPath: "./src-tauri"
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "LyricFlow ${{ github.ref_name }}"
          releaseBody: |
            ## LyricFlow ${{ github.ref_name }}

            - Word-synced lyrics are fetched automatically when available, without requiring manual refetch.
            - Improved Windows SMTC playback clock continuity.
            - Improved Pearl Light contrast across lyrics, controls, settings, and notifications.
            - Graceful handling of unavailable Genius annotation responses.

            See [README](https://github.com/badghost001/LyricFlow#readme) for project setup and existing features.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lyricflow-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/universal-apple-darwin/release/bundle/
          if-no-files-found: warn
