<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="tauri-bridge.js"></script>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' http://tauri.localhost tauri:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline';">
  <title>LyricFlow Taskbar</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #tb-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: rgba(12, 12, 16, 0.45);
      border-radius: 8px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: grab;
      transition: background 0.2s ease, border-color 0.2s ease;
      overflow: hidden;
      padding: 0 16px;
    }

    #tb-container:hover {
      background: rgba(20, 20, 28, 0.72);
      border-color: rgba(255, 255, 255, 0.18);
    }

    #tb-container.dragging {
      cursor: grabbing;
    }

    #tb-lyric {
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      font-size: 13.5px;
      font-weight: 500;
      color: #ffffff;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
      transition: opacity 0.25s ease;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    #tb-lyric.tb-hidden {
      opacity: 0 !important;
    }

    /* Progress bar */
    #tb-progress {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0%;
      height: 2.5px;
      background: #1DB954;
      border-radius: 1px;
      transition: width 0.3s linear;
      pointer-events: none;
    }

    #tb-progress.tb-hidden {
      opacity: 0 !important;
    }
  </style>
</head>
<body>
  <div id="tb-container" title="Click to open LyricFlow | Drag to reposition">
    <div id="tb-lyric">♫ Start playing Spotify...</div>
    <div id="tb-progress"></div>
  </div>
  <script src="./taskbar_renderer.js"></script>
</body>
</html>
